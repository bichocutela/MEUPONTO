name: Publish Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MEUPONTO-v0.1.0-alpha.apk

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0-alpha --yes --cleanup-tag || true
          gh release create v0.1.0-alpha MEUPONTO-v0.1.0-alpha.apk \
            --target "${GITHUB_SHA}" \
            --title "MEU PONTO v0.1.0 Alpha" \
            --prerelease \
            --notes "Primeira versão instalável do MEU PONTO. Inclui registro de ponto, almoço com lembrete, histórico, estatísticas, correção manual e novo ícone multicolorido com fundo transparente. Esta é uma prévia de testes assinada como build de desenvolvimento; a assinatura definitiva de produção será configurada antes das atualizações estáveis."
